<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/logo-on-dark.svg" />
    <script>
      (function () {
        var link = document.getElementById("favicon")
        var query = window.matchMedia("(prefers-color-scheme: dark)")
        var apply = function () {
          link.href = query.matches ? "/logo-on-dark.svg" : "/logo-on-light.svg"
        }
        apply()
        query.addEventListener("change", apply)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hack-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
