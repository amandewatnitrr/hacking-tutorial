name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 3.9: oldest version exercised on runners. The requirements
        # themselves keep Python 3.8 resolvable (see SETUP.md).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sql-injection-lab/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sql-injection-lab/requirements.txt

      - name: Import smoke check (no privileged scripts are executed)
        run: python -c "import bs4, requests, urllib3, scapy, cryptography, geoip2, flask"

      - name: Byte-compile lab and helper scripts
        run: python -m compileall -q sql-injection-lab/app sql-injection-lab/tests mask_ip_addresses.py

      - name: SQL injection lab smoke tests
        working-directory: sql-injection-lab
        run: python -m pytest -v

      - name: Leaked IP/MAC check
        run: python mask_ip_addresses.py --check
